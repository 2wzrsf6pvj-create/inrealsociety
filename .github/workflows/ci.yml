name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les runs précédents sur le même PR pour économiser les minutes CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + Type + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Bloquant : `next build` rejette de toute façon les erreurs ESLint — mieux
        # vaut les voir ici, nommées, que dans un build et un déploiement Vercel cassés.
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (Next.js)
        run: npm run build
        env:
          # Placeholders : la build n'a pas besoin d'accès réseau aux services
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-key
          NEXT_PUBLIC_APP_URL: https://placeholder.example.com

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Ne tourne que sur push main (économise minutes CI sur les PRs en draft)
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  integration:
    name: Intégration tunnel (Postgres + PostgREST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Vraie base, migrations du dépôt, aucun secret : cf. integration/README.md
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      INTEGRATION_POSTGREST_URL: http://localhost:3001
      INTEGRATION_JWT_SECRET: integration-test-secret-integration-test-secret
      POSTGREST_VERSION: v12.2.3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Base de test (rôles Supabase + migrations)
        run: bash integration/setup-db.sh

      - name: PostgREST
        run: |
          curl -sSL -o /tmp/postgrest.tar.xz \
            "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x64.tar.xz"
          tar -xf /tmp/postgrest.tar.xz -C /tmp
          PGRST_DB_URI=postgresql://authenticator:authenticator@localhost:5432/postgres \
          PGRST_DB_SCHEMAS=public PGRST_DB_ANON_ROLE=anon \
          PGRST_JWT_SECRET="$INTEGRATION_JWT_SECRET" PGRST_SERVER_PORT=3001 \
            nohup /tmp/postgrest > /tmp/postgrest.log 2>&1 &
          for i in $(seq 1 30); do curl -sf "$INTEGRATION_POSTGREST_URL/" > /dev/null && exit 0; sleep 1; done
          cat /tmp/postgrest.log; exit 1

      - name: Tests d'intégration
        run: npm run test:integration
